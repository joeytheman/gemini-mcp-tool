<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;font:16px/20px sans-serif}button{font:inherit;border:0;padding:0;margin:0;display:block}</style></head><body>
<form style="width:390px"><button data-testid="sign-in" style="width:200px;height:44px">Sign in</button></form>
<div id="error-overlay" style="position:fixed;left:0;top:0;width:0;height:0"></div>
<script>
document.getElementById('error-overlay').attachShadow({ mode: 'open' }).innerHTML =
  '<div style="position:fixed;inset:0;background:rgba(0,0,0,.8);color:#fff;font:16px/20px sans-serif">' +
  '<div><div style="width:100px;height:20px;overflow:hidden;white-space:nowrap">Uncaught Error: something broke in a component</div></div>' +
  '<button style="font:inherit;border:0;padding:0;margin:0;display:block;width:120px;height:44px">Dismiss</button></div>';
</script>
</body></html>
