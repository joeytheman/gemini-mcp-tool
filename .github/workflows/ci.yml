name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
      continue-on-error: true
    - name: Install headless Chromium
      if: matrix.node-version == '20.x'
      run: npx playwright-core install --with-deps chromium-headless-shell

    - name: Check the minified layout snippet and run its tests in headless Chromium
      if: matrix.node-version == '20.x'
      run: |
        node scripts/minify-layout-snippet.mjs --check
        npm run test:chromium
